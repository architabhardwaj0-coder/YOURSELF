<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Yourself — Learn, Practice, Improve</title>

<!--
  YOURSELF — SINGLE FILE GITHUB PAGES APP
  ---------------------------------------
  This is intentionally a single index.html file.

  IMPORTANT:
  1) GitHub Pages is a static host. It cannot securely keep a private AI/API key
     or provide real server-side authentication.
  2) This version keeps each account's data separate in the browser using
     localStorage and hashes passwords with Web Crypto. It is suitable for a
     personal/static prototype, NOT for production-grade security.
  3) For real multi-user private accounts, use Firebase/Supabase/your own backend.
  4) AI is connected through Gemini's browser API when the user adds an API key
     in Account → AI Settings. A key entered in a static website can be exposed
     to the browser, so use a restricted key and do not use this pattern for
     sensitive production data.
  5) OCR/PDF extraction uses Tesseract.js and PDF.js from CDNs.
-->

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>

<style>

.page-title{text-align:center;color:var(--blue);font-size:28px;font-weight:800;margin:24px 0 22px}
.back{border:0;background:none;color:#526070;font-weight:700;padding:8px 0}
.card{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}

.set-form{display:grid;gap:8px;margin-bottom:25px}
.set-list{display:grid;gap:11px}

.tool-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}

.dropdown{position:relative}
.dropdown-menu{position:absolute;right:0;top:calc(100% + 7px);background:#fff;border:1px solid #d7dce6;border-radius:10px;box-shadow:var(--shadow);min-width:150px;z-index:80;overflow:hidden}
.dropdown-menu button{display:block;width:100%;padding:11px 13px;border:0;background:#fff;text-align:left;color:#283247}

.camera-wrap{position:relative}
.camera-menu{position:absolute;right:0;top:58px;width:235px;background:#fff;border:1px solid #d7dce6;border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:40}

.recap-title{text-align:center;color:var(--blue);font-size:28px;font-weight:900;margin:20px 0}
.mode-box{display:flex;border:1px solid #252a34;border-radius:9px;overflow:hidden;width:max-content}

.wrong{color:var(--danger)}
.user-chip{color:#606a7a;font-size:13px}
.improve-item{padding:16px;border:1px solid #d7dce6;border-radius:14px;background:#fff}
.improve-item h3{margin:0 0 8px;color:var(--deep)}
.profile-card{padding:20px}
.avatar-big{width:88px;height:88px;border-radius:50%;background:#e0efff;display:grid;place-items:center;color:#2470d6;font-size:42px;overflow:hidden}
.avatar-big img{width:100%;height:100%;object-fit:cover}
.settings-panel{margin-top:16px;padding:15px;border:1px solid #dce2ed;border-radius:14px;background:#fafbfe}
hr{border:0;border-top:1px solid #edf0f5;margin:20px 0}
.empty{padding:30px 15px;text-align:center;color:#7a8291;border:1px dashed #cfd5e1;border-radius:14px}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#202938;color:#fff;padding:11px 15px;border-radius:10px;z-index:100;font-size:13px;box-shadow:var(--shadow)}

  .topbar{padding:10px 4%}
  .hero{grid-template-columns:1fr 125px}
  .hero-art{height:120px;font-size:55px}
  .feature{min-height:140px}
  .feature-icon{font-size:42px}
  .promo-text{font-size:17px}
  .auth-brand{font-size:38px}
}
</style>

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
/* =========================================================
   YOURSELF — SINGLE FILE APPLICATION
   ========================================================= */

const STORAGE_KEY = "yourself_users_v3";
const SESSION_KEY = "yourself_session_v3";
const AI_ENDPOINT = "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev/api/ai";

let state = {
  page: "landing",
  selectedSetId: null,
  recapMode: null,
  recapIndex: 0,
  recapOrder: [],
  recapAnswerVisible: false,
  recapLastResult: null,
  recapCondition: "",
  conceptLanguage: "English",
  vocabularyLanguage: "English",
  translationFrom: "English",
  translationTo: "Hindi",
  aiBusy: false
};

const $ = id => document.getElementById(id);
const uid = (prefix="id") => prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,9);

function getUsers(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveUsers(users){ localStorage.setItem(STORAGE_KEY, JSON.stringify(users)); }
function currentUsername(){ return localStorage.getItem(SESSION_KEY) || ""; }
function currentUser(){
  const users=getUsers(), u=currentUsername();
  return users[u] || null;
}
function saveCurrentUser(user){
  const users=getUsers();
  users[user.username]=user;
  saveUsers(users);
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  state={...state,page:"landing"};
  render();
}
async function hashPassword(value){
  const data=new TextEncoder().encode(value);
  const digest=await crypto.subtle.digest("SHA-256",data);
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.remove("hidden");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.add("hidden"),2600);
}
function go(page, extra={}){
  state.page=page;
  Object.assign(state,extra);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function requireUser(){
  if(!currentUser()){go("signin");return false}
  return true;
}

/* ---------------- AUTH ---------------- */
async function signup(){
  const username=$("suUser").value.trim();
  const email=$("suEmail").value.trim().toLowerCase();
  const password=$("suPass").value;
  const confirm=$("suConfirm").value;

  if(!username||!email||!password||!confirm){toast("Please complete all fields.");return}
  if(password!==confirm){toast("Passwords do not match.");return}
  if(password.length<6){toast("Password must be at least 6 characters.");return}

  const users=getUsers();
  if(users[username]){toast("That username is already registered. Please sign in.");return}
  if(Object.values(users).some(u=>u.email===email)){toast("That email is already registered.");return}

  const passwordHash=await hashPassword(password);
  users[username]={
    username,email,passwordHash,
    avatar:"",
    sets:[],
    pronunciation:[],
    vocabulary:[],
    translation:[],
    recapHistory:[],
    aiKey:"",
    createdAt:new Date().toISOString()
  };
  saveUsers(users);
  localStorage.setItem(SESSION_KEY,username);
  toast("Account created.");
  go("home");
}
async function signin(){
  const username=$("siUser").value.trim();
  const password=$("siPass").value;
  const users=getUsers();
  const user=users[username];
  if(!user){toast("Username or password is incorrect.");return}
  const hash=await hashPassword(password);
  if(hash!==user.passwordHash){toast("Username or password is incorrect.");return}
  localStorage.setItem(SESSION_KEY,username);
  toast("Signed in successfully.");
  go("home");
}

/* ---------------- AI ----------------
   The AI helper is used by Concept, Vocabulary, Translation,
   Recap conditions and answer checking.
*/
async function askAI(prompt){
  if(!AI_ENDPOINT || AI_ENDPOINT.includes("YOUR-WORKER-NAME")){
    throw new Error("AI_BACKEND_MISSING");
  }
  const res=await fetch(AI_ENDPOINT,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data?.error || `AI request failed (${res.status})`);
  return data?.text || "No AI response.";
}
function aiMissingMessage(){
  return `<div class="notice">AI backend is not connected yet. Deploy the included Cloudflare Worker, put your Gemini API key in the Worker secret, then paste the Worker URL into <b>AI_ENDPOINT</b> in this index.html.</div>`;
}
function aiBackendMessage(){
  return `<div class="notice">AI backend is not connected. In index.html, replace <b>YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev</b> with your deployed Worker URL.</div>`;
}

/* ---------------- RENDER ---------------- */
function render(){
  const app=$("app");
  const user=currentUser();

  if(state.page==="landing") app.innerHTML=landingHTML();
  else if(state.page==="signup") app.innerHTML=signupHTML();
  else if(state.page==="signin") app.innerHTML=signinHTML();
  else if(!user){ state.page="signin"; app.innerHTML=signinHTML(); }
  else {
    const pages={
      home:homeHTML, account:accountHTML, sets:setsHTML, setDetail:setDetailHTML,
      pronunciation:pronunciationHTML, concept:conceptHTML, vocabulary:vocabularyHTML,
      translation:translationHTML, recapSets:recapSetsHTML, recapMode:recapModeHTML,
      recap:recapHTML, improve:improveHTML
    };
    app.innerHTML=(pages[state.page]||homeHTML)();
    if(["home","sets","setDetail","pronunciation","concept","vocabulary","translation","recapSets","recapMode","recap","improve","account"].includes(state.page)){
      attachBottomNav();
    }
  }
  bindCommon();
}

function landingHTML(){
  return `<div class="auth-wrap">
    <div class="auth">
      <div class="auth-brand">YOURSELF</div>
      <p style="text-align:center;color:#737b8c;line-height:1.55">Test yourself without needing anyone to ask you questions.</p>
      <div class="row" style="justify-content:center;margin-top:35px;gap:40px">
        <button class="btn btn-outline" onclick="go('signup')">Sign Up</button>
        <button class="btn btn-outline" onclick="go('signin')">Sign In</button>
      </div>
    </div>
  </div>`;
}
function signupHTML(){
  return `<div class="auth-wrap"><div class="auth">
    <div class="auth-brand">Yourself</div>
    <h1 class="auth-title">Sign Up</h1>
    <div class="stack">
      <div><label class="field-label">Username</label><input id="suUser" class="input" autocomplete="username"></div>
      <div><label class="field-label">Email</label><input id="suEmail" class="input" type="email" autocomplete="email"></div>
      <div><label class="field-label">Password</label><div class="password-wrap"><input id="suPass" class="input" type="password" autocomplete="new-password"><button class="eye" onclick="togglePassword('suPass',this)">◉</button></div></div>
      <div><label class="field-label">Confirm Password</label><div class="password-wrap"><input id="suConfirm" class="input" type="password" autocomplete="new-password"><button class="eye" onclick="togglePassword('suConfirm',this)">◉</button></div></div>
      <button class="btn btn-dark" onclick="signup()">Sign Up</button>
    </div>
    <div class="auth-links">Already have an account? <button onclick="go('signin')">Sign In</button></div>
  </div></div>`;
}
function signinHTML(){
  return `<div class="auth-wrap"><div class="auth">
    <div class="auth-brand">Yourself</div>
    <h1 class="auth-title">Sign In</h1>
    <div class="stack">
      <div><label class="field-label">Username</label><input id="siUser" class="input" autocomplete="username"></div>
      <div><label class="field-label">Password</label><div class="password-wrap"><input id="siPass" class="input" type="password" autocomplete="current-password"><button class="eye" onclick="togglePassword('siPass',this)">◉</button></div></div>
      <button class="btn btn-dark" onclick="signin()">Sign In</button>
    </div>
    <div class="auth-links">New here? <button onclick="go('signup')">Sign Up</button></div>
  </div></div>`;
}
function togglePassword(id,btn){
  const el=$(id); el.type=el.type==="password"?"text":"password"; btn.textContent=el.type==="password"?"◉":"◉";
}

function topbar(){
  const u=currentUser();
  return `<header class="topbar">
    <button class="logo" style="border:0;background:none" onclick="go('home')"><span class="logo-y">Y</span><span>Yourself</span></button>
    <button class="profile-btn" onclick="go('account')" aria-label="Account">${u?.avatar?`<img src="${esc(u.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:"👤"}</button>
  </header>`;
}
function navItem(page,icon,label){
  return `<button class="nav-item ${state.page===page||(["recapSets","recapMode","recap"].includes(state.page)&&page==="recap")?"active":""}" onclick="go('${page}')"><span>${icon}</span><span>${label}</span></button>`;
}
function bottomNav(){
  return `<nav class="bottom-nav">
    ${navItem("home","⌂","Home")}
    ${navItem("sets","▣","Question Set")}
    ${navItem("recapSets","⟳","Recap")}
    ${navItem("improve","✧","Improve")}
  </nav>`;
}
function shell(content){return `<div class="screen">${topbar()}<main class="narrow">${content}</main>${bottomNav()}</div>`}
function attachBottomNav(){}

/* ---------------- HOME ---------------- */
function homeHTML(){
 return shell(`
  <section class="hero">
    <div><h1>Hey there! 👋</h1><p>Small steps make big progress<br>Keep going! 💙</p></div>
    <div class="hero-art">💡📚</div>
  </section>
  <section class="feature-grid">
    <button class="feature blue" onclick="go('pronunciation')"><span class="feature-icon">📣</span><span>Pronunciation</span></button>
    <button class="feature purple" onclick="go('concept')"><span class="feature-icon">💡</span><span>Concept</span></button>
    <button class="feature mint" onclick="go('vocabulary')"><span class="feature-icon">📖</span><span>Vocabulary</span></button>
    <button class="feature peach" onclick="go('translation')"><span class="feature-icon">🔤</span><span>Translation</span></button>

/* -------- OCR / PDF -------- */
async function processAttachment(input,type){
 const file=input.files?.[0];if(!file)return;
 const area=$("attachmentArea");
 if(file.size>20*1024*1024){toast("Please choose a file smaller than 20 MB.");input.value="";return}
 area.innerHTML=`<div class="notice">Reading <b>${esc(file.name)}</b> automatically. Please wait…</div>`;
 try{
   if(type==="image"){
     const dataUrl=await fileToDataURL(file);
     area.innerHTML=`<div class="file-box"><b>${esc(file.name)}</b><img class="file-preview" src="${dataUrl}"><div class="notice">Running OCR…</div></div>`;
     const result=await Tesseract.recognize(dataUrl,"eng",{logger:m=>{if(m.status&&m.progress)area.querySelector('.notice').textContent=`OCR: ${m.status} ${Math.round(m.progress*100)}%`;}});
     const text=(result.data.text||"").trim();
     window.__lastAttachment={name:file.name,type:"image",dataUrl,text};
     area.innerHTML=`<div class="file-box"><b>${esc(file.name)}</b><img class="file-preview" src="${dataUrl}"><div class="extracted">${esc(text||"No readable text detected.")}</div><button class="btn btn-primary btn-small" style="margin-top:10px" onclick="putExtractedTextIntoFields()">Use extracted text</button></div>`;
   }else{
     const pdf=await waitForPdfJs();
     const dataUrl=await fileToDataURL(file);
     const bytes=await fetch(dataUrl).then(r=>r.arrayBuffer());
     const doc=await pdf.getDocument({data:bytes}).promise;
     let text="";
     for(let i=1;i<=doc.numPages;i++){
       const page=await doc.getPage(i);
       const content=await page.getTextContent();
       text += content.items.map(x=>x.str).join(" ")+"\n";
     }
     text=text.trim();
     window.__lastAttachment={name:file.name,type:"pdf",dataUrl,text};
     area.innerHTML=`<div class="file-box"><div class="row-between"><b>${esc(file.name)}</b><button class="btn btn-light btn-small" onclick="togglePdfPreview()">Open PDF</button></div><div id="pdfPreviewBox" class="hidden" style="margin-top:9px"><iframe class="pdf-preview" src="${dataUrl}"></iframe></div><div class="extracted" style="margin-top:10px">${esc(text||"No embedded text found. You can still open the PDF or type the question manually.")}</div><button class="btn btn-primary btn-small" style="margin-top:10px" onclick="putExtractedTextIntoFields()">Use extracted text</button></div>`;
     if(!text)toast("PDF uploaded. This PDF has no text layer; type the question manually or use a text-based PDF.");
   }
   toast("File uploaded and read successfully.");
 }catch(err){
   console.error(err);
   area.innerHTML=`<div class="notice">The file was selected but its text could not be extracted automatically. You can still type the question and answer manually.</div>`;
   toast("File reading failed. Please try another file.");
 }
}
function togglePdfPreview(){ $("pdfPreviewBox")?.classList.toggle("hidden"); }
function putExtractedTextIntoFields(){
 const t=window.__lastExtracted||"";
 if($("qInput")) $("qInput").value=t;
 toast("Extracted text placed in Question field.");
}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}

/* PDF.js global build is loaded in the <head>. */
function waitForPdfJs(timeout=8000){
  return new Promise((resolve,reject)=>{
    const start=Date.now();
    const timer=setInterval(()=>{
      if(window.pdfjsLib){clearInterval(timer);resolve(window.pdfjsLib);}
      else if(Date.now()-start>timeout){clearInterval(timer);reject(new Error("PDF library did not load"));}
    },100);
  });
}

async function startSpeech(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
   toast("Speech recognition is not supported in this browser. Try Chrome or Edge over HTTPS.");
   return;
 }
 try{
   if(!navigator.mediaDevices?.getUserMedia) throw new Error("MIC_UNAVAILABLE");
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   stream.getTracks().forEach(t=>t.stop());
 }catch(e){
   toast("Microphone permission is blocked. Click the lock icon near the address bar → Microphone → Allow, then try again.");
   return;
 }
 const rec=new SpeechRecognition();
 rec.lang="en-IN";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=3;
 rec.onstart=()=>toast("Listening… speak now");
 rec.onresult=e=>{
   let text="";
   for(let i=e.resultIndex;i<e.results.length;i++) text+=e.results[i][0].transcript;
   if($("pronInput")) $("pronInput").value=text.trim();
   if($("pronResult")) $("pronResult").textContent=text.trim()||"Listening…";
 };
 rec.onerror=e=>{
   const msg=e.error==="not-allowed"?"Microphone permission was denied. Allow microphone access and try again.":e.error==="no-speech"?"No speech detected. Tap the mic and speak clearly.":"Microphone recognition failed. Try Chrome/Edge over HTTPS.";
   toast(msg);
 };
 rec.onend=()=>{};
 try{rec.start();}catch(e){toast("Could not start the microphone. Please try again.");}
}
function speakPronunciation(){

    <button class="btn btn-light" onclick="startRecap('group')">Group</button>
   </div>
  </div>
 `)
}
function startRecap(mode){
 const s=selectedSet();
 if(!s||!s.questions.length){toast("Add questions to this set first.");return}
 state.recapMode=mode;
 state.recapOrder=s.questions.map((_,i)=>i);
 if(mode==="group") state.recapOrder.sort(()=>Math.random()-.5);
 state.recapIndex=0;state.recapAnswerVisible=false;state.recapLastResult=null;
 go("recap");
}
function currentRecapQuestion(){
 const s=selectedSet(); if(!s||!state.recapOrder.length)return null;
 return s.questions[state.recapOrder[state.recapIndex]];
}
function recapHTML(){
 const s=selectedSet(),q=currentRecapQuestion();
 if(!s||!q)return shell(`<div class="empty">No recap question available.</div>`);
 const result=state.recapLastResult;
 return shell(`
  <button class="back" onclick="go('recapMode')">← Back</button>
  <div class="recap-title">${esc(s.name)} Recap</div>
  <div class="control-row">
    <div class="row">
      <button class="btn btn-primary btn-small" onclick="startRecap('${state.recapMode||"individual"}')">START</button>
      <div class="dropdown"><button class="btn btn-light btn-small" onclick="toggleMenu('conditionMenu')">Condition</button>
       <div id="conditionMenu" class="dropdown-menu hidden" style="right:auto;left:0;width:300px;padding:10px">
        <textarea id="conditionInput" class="textarea" style="min-height:80px" placeholder="Describe how questions should be selected or asked"></textarea>
        <button class="btn btn-primary btn-small" style="margin-top:7px" onclick="saveCondition()">Add Condition</button>
        <button class="btn btn-danger btn-small" style="margin-top:7px" onclick="removeCondition()">Remove Condition</button>
       </div>
      </div>
    </div>
    <span class="small muted">${state.recapCondition?`Condition: ${esc(state.recapCondition)}`:"No condition"}</span>
  </div>
  <div class="control-row">
    <div class="mode-box">
      <button class="${state.recapMode==='group'?'active':''}" onclick="setRecapMode('group')">Random</button>
      <button class="${state.recapMode==='individual'?'active':''}" onclick="setRecapMode('individual')">Series</button>
    </div>
    <button class="btn btn-outline" onclick="toggleRecapAnswer()">${state.recapAnswerVisible?"UNHIDE":"HIDE"}</button>
  </div>
  <div class="question-card">
    <div class="row-between"><span class="user-chip">User: ${esc(currentUser().username)}</span><span class="small muted">Question ${state.recapIndex+1}/${state.recapOrder.length}</span></div>
    <p class="question-text">${esc(q.question)}</p>
    <div class="answer-area">
      <label class="field-label">Your Answer</label>
      <textarea id="recapUserAnswer" class="textarea" placeholder="Write your answer here"></textarea>
      <button class="btn btn-primary" style="margin-top:9px" onclick="submitRecapAnswer()">DONE — SUBMIT ANSWER</button>
    </div>
    ${state.recapAnswerVisible?`<div class="notice" style="margin-top:12px"><b>Correct Answer:</b><br>${esc(q.answer)}</div>`:""}
    ${result?`<div class="notice" style="margin-top:12px"><span class="${result.correct?'correct':'wrong'}"><b>${result.correct?'Correct':'Incorrect'}</b></span> · <span class="score">Score: ${result.score}</span><br>${esc(result.feedback||"")}</div>`:""}
  </div>
  <div class="row" style="justify-content:center;margin-top:14px">
    <button class="btn btn-light" onclick="nextRecapQuestion()">NEXT QUESTION</button>
  </div>
  <div id="recapAI" class="ai-box" style="margin-top:14px">
    <div class="ai-title">AI Condition Helper</div>
    <div class="chat-row"><input id="conditionAIInput" class="input" placeholder="Ask AI to create/refine a condition"><button class="btn btn-outline" onclick="askRecapConditionAI()">Ask AI</button></div>
    <div id="conditionAIOutput" class="small muted" style="margin-top:9px"></div>
  </div>
 `)
}
function saveCondition(){
 const value=$("conditionInput")?.value.trim();
 if(!value){toast("Write a condition first.");return}
 state.recapCondition=value;toast("Condition added.");render();
}
function removeCondition(){state.recapCondition="";toast("Condition removed.");render()}
function setRecapMode(mode){
 state.recapMode=mode;
 const s=selectedSet();state.recapOrder=s.questions.map((_,i)=>i);
 if(mode==="group")state.recapOrder.sort(()=>Math.random()-.5);
 state.recapIndex=0;state.recapLastResult=null;state.recapAnswerVisible=false;render();
}
function toggleRecapAnswer(){state.recapAnswerVisible=!state.recapAnswerVisible;render()}
async function submitRecapAnswer(){
 const answer=$("recapUserAnswer")?.value.trim(),q=currentRecapQuestion();
 if(!answer){toast("Write your answer before submitting.");return}
 try{
   const out=await askAI(`Act as a strict but helpful quiz evaluator. Compare the user's answer with the correct answer. Return JSON only in this exact shape: {"correct":true/false,"score":5 or -5,"feedback":"short explanation"}. Give 5 for substantively correct and -5 for substantively incorrect. Equivalent meaning counts. Question: ${q.question}\nCorrect answer: ${q.answer}\nUser answer: ${answer}`);
   let result;
   try{result=JSON.parse(out.match(/\{[\s\S]*\}/)?.[0]||out)}catch(e){result={correct:/true/i.test(out),score:/true/i.test(out)?5:-5,feedback:out}}
   state.recapLastResult=result;state.recapAnswerVisible=true;
   const u=currentUser();
   u.recapHistory.push({id:uid("rh"),setId:selectedSet().id,questionId:q.id,question:q.question,correctAnswer:q.answer,userAnswer:answer,correct:!!result.correct,score:Number(result.score)||0,feedback:result.feedback||"",time:new Date().toISOString()});
   saveCurrentUser(u);render();
 }catch(e){
   toast(e.message==="AI_BACKEND_MISSING"?"AI backend is not connected yet.":e.message);
 }
}
function nextRecapQuestion(){
 const s=selectedSet();if(state.recapIndex<state.recapOrder.length-1){state.recapIndex++;state.recapLastResult=null;state.recapAnswerVisible=false;render()}else{toast("This recap is complete.");}
}
async function askRecapConditionAI(){
 const text=$("conditionAIInput").value.trim();if(!text){toast("Tell AI what you want.");return}
 const out=$("conditionAIOutput");out.textContent="Thinking…";
 try{
  const ans=await askAI(`Create a concise quiz-selection condition for a study recap. User request: ${text}. Return only the condition sentence, suitable for applying to questions from a saved question set.`);
  out.innerHTML=`${esc(ans)} <button class="btn btn-light btn-small" style="margin-left:6px" onclick="useAICondition()">Use</button>`;
  window.__aiCondition=ans;
 }catch(e){out.innerHTML=e.message==="AI_BACKEND_MISSING"?aiBackendMessage():esc(e.message)}
}
function useAICondition(){state.recapCondition=window.__aiCondition||"";toast("AI condition added.");render()}

/* ---------------- IMPROVE ---------------- */
function improveHTML(){
 const u=currentUser();
 const wrong=u.recapHistory.filter(x=>!x.correct);
 const grouped={};
 wrong.forEach(x=>{grouped[x.setId]??=[];grouped[x.setId].push(x)});
 return shell(`
  <div class="page-title">Improve</div>
  <p class="muted" style="text-align:center">Review the answers you got wrong in Recap and practice them again.</p>
  <div class="set-list" style="margin-top:18px">
   ${u.sets.map(s=>`<button class="set-item" onclick="showImproveSet('${s.id}')"><span>${esc(s.name)}<br><small>${(grouped[s.id]||[]).length} incorrect</small></span><span>›</span></button>`).join("")||`<div class="empty">Your saved Question Sets will appear here.</div>`}
  </div>
  <div id="improveDetail" style="margin-top:16px"></div>
 `)
}
function showImproveSet(setId){
 const u=currentUser(),s=u.sets.find(x=>x.id===setId),wrong=u.recapHistory.filter(x=>x.setId===setId&&!x.correct);
 const box=$("improveDetail");
 if(!box)return;
 box.innerHTML=wrong.length?wrong.map((x,i)=>`<div class="improve-item" style="margin-bottom:10px">
   <h3>Question ${i+1}</h3>
   <p><b>Question:</b> ${esc(x.question)}</p>
   <p class="wrong"><b>Your answer:</b> ${esc(x.userAnswer)}</p>
   <p class="correct"><b>Correct answer:</b> ${esc(x.correctAnswer)}</p>
   <p><b>Score:</b> ${x.score}</p>
   <p class="muted">${esc(x.feedback)}</p>
   <button class="btn btn-outline btn-small" onclick="askImproveAIByHistoryId('${x.id}')">Explain My Mistake with AI</button>
 </div>`).join(""):`<div class="empty">No incorrect recap answers for this set yet.</div>`;
}
async function askImproveAI(q,a){
 try{
  const ans=await askAI(`Explain this study mistake simply. Question: ${q}. Correct answer: ${a}. Give the likely misconception, the correct reasoning, and one short practice tip.`);
  const detail=$("improveDetail");detail.insertAdjacentHTML("afterbegin",`<div class="ai-box" style="margin-bottom:10px"><div class="ai-title">AI Explanation</div><div class="output">${esc(ans)}</div></div>`);
 }catch(e){toast(e.message==="AI_BACKEND_MISSING"?"Connect the secure AI backend in index.html first.":e.message)}
}

/* ---------------- COMMON ---------------- */
function bindCommon(){
 document.querySelectorAll(".dropdown-menu").forEach(menu=>{
   // Prevent clicks inside menus from bubbling to any future page-level handler.
   menu.addEventListener("click",e=>e.stopPropagation());
 });
}
window.go=go;window.togglePassword=togglePassword;window.signup=signup;window.signin=signin;
window.logout=logout;window.updateAvatar=updateAvatar;
window.addSet=addSet;window.saveQuestion=saveQuestion;window.deleteQuestion=deleteQuestion;
window.processAttachment=processAttachment;window.togglePdfPreview=togglePdfPreview;window.putExtractedTextIntoFields=putExtractedTextIntoFields;
window.startSpeech=startSpeech;window.speakPronunciation=speakPronunciation;window.savePronunciation=savePronunciation;window.deletePronunciation=deletePronunciation;
window.toggleMenu=toggleMenu;window.setConceptLang=setConceptLang;window.triggerHiddenFile=triggerHiddenFile;window.conceptAttachment=conceptAttachment;window.askConcept=askConcept;
window.openVocabAdd=openVocabAdd;window.openVocabRequest=openVocabRequest;window.generateVocabulary=generateVocabulary;window.saveVocabulary=saveVocabulary;window.saveVocabToSet=saveVocabToSet;
window.translateText=translateText;
window.startRecap=startRecap;window.saveCondition=saveCondition;window.removeCondition=removeCondition;window.setRecapMode=setRecapMode;window.toggleRecapAnswer=toggleRecapAnswer;window.submitRecapAnswer=submitRecapAnswer;window.nextRecapQuestion=nextRecapQuestion;window.askRecapConditionAI=askRecapConditionAI;window.useAICondition=useAICondition;
function askImproveAIByHistoryId(historyId){
 const h=currentUser()?.recapHistory?.find(x=>x.id===historyId);
 if(!h){toast("Mistake record not found.");return}
 askImproveAI(h.question,h.correctAnswer);
}
window.showImproveSet=showImproveSet;window.askImproveAI=askImproveAI;window.askImproveAIByHistoryId=askImproveAIByHistoryId;

render();
</script>
</body>
