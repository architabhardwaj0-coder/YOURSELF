<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yourself - Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Pure white background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .main-title {
            color: #0000FF; /* Blue color */
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .sub-text {
            color: #000000; /* Black color */
            font-size: 16px;
            margin-bottom: 30px;
        }
        .auth-links {
            display: flex;
            justify-content: space-between;
            width: 250px;
            margin: 0 auto;
        }
        .auth-links a {
            color: #0000FF; /* Blue color */
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-title">YOURSELF</div>
        <div class="sub-text">Test yourself without needing any one to ask you question.</div>
        
        <div class="auth-links">
            <a href="/signup">Sign Up</a>
            <a href="/signin">Sign In</a>
        </div>
    </div>

</body>
</html>
