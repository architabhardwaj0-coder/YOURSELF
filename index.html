<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Yourself</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--blue:#3155D9;--ink:#183B75;--line:#d8dfeb;--soft:#eef5ff}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:78px}.top{height:70px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;gap:9px;align-items:center;font-size:25px;font-weight:850}.logoY{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#3155d9,#7758e9);color:#fff;display:grid;place-items:center;font-weight:900}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#f4f8ff;color:var(--blue);display:grid;place-items:center}.page{padding:8px 18px 25px}.title{text-align:center;font-size:25px;font-weight:850;margin:10px 0 22px}.back{border:0;background:none;font-weight:750;color:var(--ink);padding:4px 0}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px 25px}.hero h1{font-size:28px;margin:0 0 5px}.hero p{color:#8490a4;line-height:1.45;margin:0}.heroart{width:145px;height:115px;border-radius:50%;background:#eef6ff;display:grid;place-items:center;font-size:58px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.feature{height:170px;border-radius:17px;border:1px solid #dce5f0;font-weight:800;color:var(--ink);font-size:17px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}.feature:nth-child(1){background:#eef7ff}.feature:nth-child(2){background:#f6f0ff}.feature:nth-child(3){background:#effaf5}.feature:nth-child(4){background:#fff5ec}.emoji{font-size:46px}.quote{font-size:21px;font-weight:850;color:#24509d;transform:rotate(-4deg);line-height:1.1}.bottomart{display:flex;justify-content:space-between;align-items:end;padding:28px 5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;height:78px;background:#fff;border-top:1px solid #e4e8ef;display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.nav button{border:0;background:none;color:#7d8798;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav .active{color:var(--blue);font-weight:800}.nicon{font-size:22px}.field{margin:13px 0}.label{display:block;font-size:14px;font-weight:750;margin-bottom:7px}.input,.area,.select{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 13px;background:#fff;outline:none;color:#17243a}.input:focus,.area:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3155d915}.area{min-height:100px;resize:vertical}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:800}.primary{background:var(--blue);color:#fff}.dark{background:#183b75;color:#fff}.outline{background:#fff;color:var(--blue);border:1px solid #ccd6e4;border-radius:9px;padding:10px 13px;font-weight:750}.danger{background:#fff5f5;color:#c33e3e;border:1px solid #efcccc;border-radius:9px;padding:10px 13px;font-weight:750}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.card{border:1px solid #dce3ed;border-radius:13px;padding:14px;background:#fff}.set{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #d4dce8;background:#fff;color:var(--blue);border-radius:8px;padding:13px;margin:8px 0;text-align:left;font-weight:800}.ai{margin-top:14px;background:#f4f8ff;border:1px solid #d9e5fa;border-radius:13px;padding:14px}.result{white-space:pre-wrap;line-height:1.6;color:#243b60}.muted{color:#7d899d}.small{font-size:12px}.auth{min-height:100vh;display:grid;place-items:center;padding:30px 24px}.authbox{width:100%;max-width:390px}.brand{text-align:center;font-size:26px;font-weight:850;color:var(--blue);margin-bottom:25px}.auth h1{text-align:center;font-size:34px;margin:0 0 27px}.authswitch{display:flex;justify-content:center;gap:32px;margin-bottom:28px}.authswitch button{border:0;background:none;color:var(--blue);font-weight:800;font-size:18px;padding-bottom:5px}.authswitch .on{border-bottom:2px solid var(--blue)}.profile{text-align:center}.photo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #dce7fa;background:#eef5ff}.pill{border:1px solid #ccd6e4;background:#fff;border-radius:8px;padding:8px 11px;color:var(--blue);font-weight:800}.pill.on{background:var(--blue);color:#fff}.tabs{display:flex;gap:8px}.preview{border:1px solid #dce3ed;border-radius:9px;padding:10px;background:#fafbfd;margin-top:9px;max-height:280px;overflow:auto}.preview img{max-width:100%;max-height:200px;display:block;margin:auto;border-radius:8px}.modal{position:fixed;inset:0;background:#13243b55;display:none;align-items:flex-end;z-index:50}.modal.on{display:flex}.sheet{width:100%;max-width:560px;margin:auto;background:#fff;border-radius:19px 19px 0 0;padding:18px}.sheet h3{margin:0 0 12px}.score{font-size:25px;font-weight:900;color:var(--blue)}.wrong{background:#fff5f5;border-left:4px solid #d74b4b;padding:11px;border-radius:7px;margin:8px 0}.correct{background:#f1fbf5;border-left:4px solid #35a66b;padding:11px;border-radius:7px;margin:8px 0}.empty{text-align:center;padding:28px;color:#8b96a8}.loading{color:var(--blue);font-weight:800}.chat{display:flex;gap:8px}.chat>*:first-child{flex:1}@media(min-width:700px){body{background:#f8fafc}.app{background:#fff;box-shadow:0 0 35px #26384b0d}}
</style></head>
<body><div id="app"></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
/* SINGLE FILE APP. All pages below are linked from buttons. Data is isolated per account in this browser. For real production multi-device privacy, replace localStorage auth/data with a server database + sessions. */
const KEY='yourself_v6',AI_ENDPOINT='/api/ai';let DB=JSON.parse(localStorage.getItem(KEY)||'{"users":{},"current":null}');let S={page:'auth',mode:'in',set:null,recap:null,recapMode:null,idx:0,order:'series',show:false,condition:''};
const $=id=>document.getElementById(id),u=()=>DB.current?DB.users[DB.current]:null,save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return crypto.randomUUID?.()||Date.now()+Math.random()}async function sha(x){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function go(p,o={}){S={...S,...o,page:p};render()}function nav(p){if(!u())return go('auth');go(p)}function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;z-index:99;bottom:92px;left:50%;transform:translateX(-50%);background:#183b75;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px';document.body.appendChild(x);setTimeout(()=>x.remove(),2000)}
function top(){return `<header class="top"><div class="logo"><span class="logoY">Y</span>Yourself</div><button class="icon" onclick="go('account')">●</button></header>`}function back(){return `<button class="back" onclick="go('home')">‹ Back</button>`}
function bottom(a){return `<nav class="nav"><button class="${a==='home'?'active':''}" onclick="nav('home')"><span class="nicon">⌂</span>Home</button><button class="${a==='sets'?'active':''}" onclick="nav('sets')"><span class="nicon">▤</span>Question Set</button><button class="${a==='recap'?'active':''}" onclick="nav('recap')"><span class="nicon">↻</span>Recap</button><button class="${a==='improve'?'active':''}" onclick="nav('improve')"><span class="nicon">✦</span>Improve</button></nav>`}
function render(){if(!u()&&S.page!=='auth')S.page='auth';let p={auth:auth,home:home,account:account,pron:pron,concept:concept,vocab:vocab,trans:trans,sets:sets,set:setPage,recap:recap,quiz:quiz,improve:improve}[S.page]||home;document.getElementById('app').innerHTML=p();window.scrollTo(0,0)}
function auth(){return `<main class="auth"><div class="authbox"><div class="brand">Yourself</div><div class="authswitch"><button class="${S.mode==='in'?'on':''}" onclick="S.mode='in';render()">Sign In</button><button class="${S.mode==='up'?'on':''}" onclick="S.mode='up';render()">Sign Up</button></div><h1>${S.mode==='in'?'Sign In':'Sign Up'}</h1>${S.mode==='in'?`<div class="field"><label class="label">Username</label><input id="login" class="input" autocomplete="username"></div><div class="field"><label class="label">Password</label><input id="pass" type="password" class="input" autocomplete="current-password"></div><button class="btn dark" style="width:100%" onclick="signin()">Sign In</button>`:`<div class="field"><label class="label">Username</label><input id="su" class="input" autocomplete="username"></div><div class="field"><label class="label">Email</label><input id="se" type="email" class="input"></div><div class="field"><label class="label">Password</label><input id="sp" type="password" class="input" autocomplete="new-password"></div><button class="btn dark" style="width:100%" onclick="signup()">Sign Up</button>`}</div></main>`}
async function signup(){let n=$('su').value.trim(),e=$('se').value.trim().toLowerCase(),p=$('sp').value;if(!n||!e||!p)return toast('Complete all fields.');if(Object.values(DB.users).some(x=>x.username.toLowerCase()===n.toLowerCase()||x.email===e))return toast('Username or email already exists.');let k=id();DB.users[k]={id:k,username:n,email:e,password:await sha(p),photo:'',sets:[],vocab:[],wrong:[],score:0};DB.current=k;save();go('home')}
async function signin(){let k=$('login').value.trim().toLowerCase(),p=$('pass').value,found=Object.values(DB.users).find(x=>x.username.toLowerCase()===k||x.email===k);if(!found)return toast('Account not found.');if(found.password!==await sha(p))return toast('Wrong password.');DB.current=found.id;save();go('home')}
function home(){return `<div class="app">${top()}<main class="page"><section class="hero"><div><h1>Hey there! 👋</h1><p>Small steps make big progress<br>Keep going! 💙</p></div><div class="heroart">💡</div></section><div class="grid"><button class="feature" onclick="go('pron')"><span class="emoji">📣</span>Pronunciation</button><button class="feature" onclick="go('concept')"><span class="emoji">💡</span>Concept</button><button class="feature" onclick="go('vocab')"><span class="emoji">📖</span>Vocabulary</button><button class="feature" onclick="go('trans')"><span class="emoji">A文</span>Translation</button></div><div class="bottomart"><div class="quote">Better<br>Learning<br>Brighter Future ✦</div><div style="font-size:52px">📚✏️</div></div></main>${bottom('home')}</div>`}
function account(){let x=u();return `<div class="app">${top()}<main class="page">${back()}<h2 class="title">Account</h2><div class="card profile"><img class="photo" src="${x.photo||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2292%22 height=%2292%22%3E%3Ccircle cx=%2246%22 cy=%2246%22 r=%2246%22 fill=%22%23eef5ff%22/%3E%3Ccircle cx=%2246%22 cy=%2235%22 r=%2215%22 fill=%22%233155d9%22/%3E%3Cpath d=%22M20 78c5-22 47-22 52 0%22 fill=%22%233155d9%22/%3E%3C/svg%3E'}><input id="photo" hidden type="file" accept="image/*" onchange="photo(event)"><h3>${esc(x.username)}</h3><div class="muted">${esc(x.email)}</div><button class="outline" onclick="$('photo').click()">Update Photo</button></div><div class="card field"><b>Username</b><div>${esc(x.username)}</div></div><div class="card field"><b>Email</b><div>${esc(x.email)}</div></div><div class="card field"><b>Password</b><div>••••••••</div><span class="small muted">Password is never shown in plain text.</span></div><button class="danger" style="width:100%" onclick="DB.current=null;save();go('auth')">↪ Logout</button></main></div>`}
function photo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{u().photo=r.result;save();render()};r.readAsDataURL(f)}
function pron(){return `<div class="app">${top()}<main class="page">${back()}<h2 class="title">Pronunciation</h2><div class="row"><input id="word" class="input" oninput="$('wordout').textContent=this.value"><button class="icon" onclick="listenIn()">◉</button></div><div class="ai"><b>Result</b><div id="wordout" class="result" style="font-size:22px;min-height:34px"></div><button class="outline" onclick="speak($('wordout').textContent)">🔊 Listen</button></div></main></div>`}
function listenIn(){let R=SpeechRecognition||webkitSpeechRecognition;if(!R)return toast('Speech recognition is not supported.');let r=new R();r.lang='en-IN';r.onresult=e=>{$('word').value=e.results[0][0].transcript;$('wordout').textContent=$('word').value};r.start()}function speak(t){if(!t.trim())return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
function concept(){return `<div class="app">${top()}<main class="page">${back()}<div class="row"><h2 class="title" style="flex:1">Concept</h2><select id="cl" class="select" style="max-width:125px"><option>English</option><option>Hindi</option><option>Hinglish</option></select></div><div class="row"><textarea id="cq" class="area" placeholder=""></textarea><button class="icon" onclick="upload('concept')">▣</button></div><div class="row" style="margin-top:9px"><button class="btn primary" onclick="conceptAI()">DONE — EXPLAIN</button><button class="outline" onclick="render()">Clear</button></div><div id="cp"></div><div id="cr" class="ai"><b>Explanation</b><p class="muted">Ask any Math, Reasoning, Science, History or paragraph question.</p></div></main></div>`}
async function conceptAI(){let q=$('cq').value.trim();if(!q)return toast('Enter a question/concept.');await ai('cr',`Explain this concept in ${$('cl').value}. Use simple language, step-by-step reasoning, examples and a short takeaway. If it is a math/reasoning problem, solve it clearly.\nQuestion: ${q}`)}
function vocab(){let x=u();return `<div class="app">${top()}<main class="page">${back()}<h2 class="title">Vocabulary</h2><div class="ai"><label class="label">Tell AI what vocabulary you need</label><textarea id="vp" class="area" placeholder="Example: Give me 20 advanced GRE words with meaning, synonym, antonym, pronunciation and examples."></textarea><div class="tabs" style="margin-top:8px"><button class="pill" onclick="$('vp').value='20 advanced GRE words'">20 Advanced</button><button class="pill" onclick="$('vp').value='30 advanced GRE words'">30 GRE</button><button class="pill" onclick="$('vp').value='20 daily food and cooking words'">Daily</button></div><button class="btn primary" style="width:100%;margin-top:9px" onclick="vocabAI()">GET VOCABULARY</button></div><div id="vr" class="section"></div><div class="card" style="position:relative"><button class="outline" style="position:absolute;right:10px;top:10px" onclick="addWord()">＋ Add Word</button><b>My Vocabulary</b><div style="margin-top:35px">${x.vocab.length?x.vocab.map(v=>`<div class="set"><span>${esc(v.word)}</span><span class="small muted">${esc(v.meaning)}</span></div>`).join(''):'<div class="empty">No saved words yet.</div>'}</div></div></main></div>`}
async function vocabAI(){let p=$('vp').value.trim();if(!p)return toast('Tell AI what words you want.');await ai('vr',`Vocabulary-only request: ${p}. Give numbered words with meaning, pronunciation, synonym, antonym when natural, and a short example sentence. Stay only on English vocabulary.`)}
function addWord(){modal(`<h3>Add Word</h3><label class="label">Word</label><input id="aw" class="input"><label class="label" style="margin-top:9px">Meaning</label><textarea id="am" class="area"></textarea><div class="row" style="margin-top:9px"><button class="btn primary" onclick="saveWord(0)">Save</button><button class="outline" onclick="saveWord(1)">Save As</button></div><p class="small muted">Save As saves this word as a Question inside a selected Question Set.</p>`)}
function saveWord(as){let w=$('aw').value.trim(),m=$('am').value.trim();if(!w)return toast('Enter a word.');if(as){let sets=u().sets;if(!sets.length)return toast('Create a Question Set first.');modal(`<h3>Save As — Question Set</h3><select id="ss" class="select">${sets.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn primary" style="width:100%;margin-top:10px" onclick="wordToSet('${encodeURIComponent(w)}','${encodeURIComponent(m)}')">Save As</button>`);return}u().vocab.unshift({id:id(),word:w,meaning:m});save();close();render();toast('Word saved.')}
function wordToSet(w,m){let s=u().sets.find(s=>s.id===$('ss').value);s.items.push({id:id(),question:decodeURIComponent(w),answer:decodeURIComponent(m),ocr:''});save();close();toast('Saved to Question Set.')}
function trans(){return `<div class="app">${top()}<main class="page">${back()}<h2 class="title">Translation</h2><div class="row"><div><label class="label">From</label><select id="tf" class="select"><option>English</option><option>Hindi</option><option>Hinglish</option></select></div><div><label class="label">To</label><select id="tt" class="select"><option>Hindi</option><option>English</option><option>Hinglish</option></select></div></div><div class="field"><label class="label">Text</label><textarea id="tx" class="area"></textarea></div><button class="btn primary" style="width:100%" onclick="translateAI()">TRANSLATE</button><div id="tr" class="ai"><b>Translation</b></div></main></div>`}
async function translateAI(){let t=$('tx').value.trim();if(!t)return toast('Enter text.');await ai('tr',`Translate from ${$('tf').value} to ${$('tt').value}. If target is Hinglish, use Roman Hindi mixed naturally with English. If English to English, explain/rephrase in simple English. Return only the result.\n${t}`)}
function sets(){let x=u();return `<div class="app">${top()}<main class="page">${back()}<h2 class="title">Question Set</h2><div class="card"><label class="label">Name of Set</label><div class="row"><input id="sn" class="input" placeholder="Add Set Name"><button class="btn primary" onclick="newSet()">Add</button></div></div><div class="field"><b>Saved Sets</b>${x.sets.length?x.sets.map(s=>`<button class="set" onclick="S.set='${s.id}';go('set')">${esc(s.name)} <span>→</span></button>`).join(''):'<div class="empty">No sets yet. Only sets you create are shown.</div>'}</div><div style="text-align:center;font-size:50px;padding:18px">📚💡🎓</div></main>${bottom('sets')}</div>`}
function newSet(){let n=$('sn').value.trim();if(!n)return toast('Enter a set name.');if(u().sets.some(s=>s.name.toLowerCase()===n.toLowerCase()))return toast('Set already exists.');u().sets.push({id:id(),name:n,items:[]});save();render()}
function setPage(){let s=u().sets.find(x=>x.id===S.set);if(!s)return go('sets');return `<div class="app">${top()}<main class="page"><button class="back" onclick="go('sets')">‹ Back</button><h2 class="title">${esc(s.name)}</h2><div class="card"><label class="label">Add the Question</label><textarea id="qq" class="area"></textarea><label class="label" style="margin-top:10px">Add the Answer</label><textarea id="aa" class="area"></textarea><div class="row" style="margin-top:9px"><button class="btn primary" onclick="saveQ()">Save</button><button class="outline" onclick="upload('set')">📎 Photo / PDF</button></div><div id="sp"></div></div><div class="field"><b>Saved Questions (${s.items.length})</b>${s.items.map((it,i)=>`<div class="card" style="margin:8px 0"><b>Q${i+1}.</b> ${esc(it.question)}<div><b>Answer:</b> ${esc(it.answer)}</div>${it.ocr?`<details><summary>Extracted text</summary><div class="preview">${esc(it.ocr)}</div></details>`:''}</div>`).join('')||'<div class="empty">No questions yet.</div>'}</div></main></div>`}
function saveQ(){let q=$('qq').value.trim(),a=$('aa').value.trim();if(!q||!a)return toast('Add question and answer.');u().sets.find(s=>s.id===S.set).items.push({id:id(),question:q,answer:a,ocr:''});save();render();toast('Saved.')}
function upload(target){modal(`<h3>Add Photo / PDF</h3><button class="outline" style="width:100%" onclick="pick('image','${target}')">📷 Camera / Gallery</button><button class="outline" style="width:100%;margin-top:8px" onclick="pick('pdf','${target}')">📄 PDF</button><input id="fi" hidden type="file" accept="image/*" onchange="attach(event,'${target}')"><input id="fp" hidden type="file" accept="application/pdf" onchange="attach(event,'${target}')"><p class="small muted">Text extraction starts automatically. The visible preview contains the extracted text so it can be used in Recap.</p>`)}
function pick(t){$(t==='image'?'fi':'fp').click()}async function attach(e,target){let f=e.target.files[0];if(!f)return;close();toast('Reading file…');let text='';if(f.type.startsWith('image/')){text=await ocr(f);let d=await data(f);if(target==='set'){$('sp').innerHTML=`<div class="preview"><img src="${d}"><p>${esc(text)}</p></div>`;$('qq').value=text}else{$('cp').innerHTML=`<div class="preview"><img src="${d}"><p>${esc(text)}</p></div>`;$('cq').value=text}}else{text=await pdfText(f);if(target==='set'){$('qq').value=text;$('sp').innerHTML=`<div class="preview"><b>PDF extracted text</b><p>${esc(text)}</p></div>`}else{$('cq').value=text;$('cp').innerHTML=`<div class="preview"><b>PDF extracted text</b><p>${esc(text)}</p></div>`}}toast('Text extracted.')}function data(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}async function ocr(f){if(!window.Tesseract)return 'OCR unavailable';let r=await Tesseract.recognize(f,'eng');return r.data.text.trim()}async function pdfText(f){try{let m=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');let pdf=await m.getDocument({data:await f.arrayBuffer()}).promise,out='';for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),c=await p.getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n\n'}return out.trim()}catch(e){return 'PDF text extraction failed. A server-side PDF/OCR service can be connected here.'}}
function recap(){let x=u();return `<div class="app">${top()}<main class="page">${back()}<div style="text-align:center;color:#111;font-weight:850;font-size:18px;margin:4px 0 16px">Let's recap with yourself</div><div style="width:120px;margin:auto;border:1px solid #222;text-align:center;padding:10px;color:var(--blue);font-weight:850">RECAP</div><div class="field"><b>Question Sets</b>${x.sets.length?x.sets.map(s=>`<button class="set" onclick="S.recap='${s.id}';S.recapMode=null;go('quiz')">${esc(s.name)} <span>→</span></button>`).join(''):'<div class="empty">Saved Question Sets appear here.</div>'}</div></main>${bottom('recap')}</div>`}
function quiz(){let s=u().sets.find(x=>x.id===S.recap);if(!s)return go('recap');if(!S.recapMode)return `<div class="app">${top()}<main class="page">${back()}<h2 class="title">${esc(s.name)} Recap</h2><div class="card"><b>Select</b><div class="row" style="margin-top:10px"><button class="outline" onclick="startQuiz('Individual')">Individual</button><button class="outline" onclick="startQuiz('Group')">Group</button></div></div></main></div>`;let it=s.items[S.idx%s.items.length];return `<div class="app">${top()}<main class="page"><button class="back" onclick="go('recap')">‹ Back</button><h2 class="title">${esc(s.name)} Recap</h2><div class="row"><button class="outline">START</button><button class="outline" onclick="condition()">Condition</button><button class="outline" onclick="S.show=!S.show;render()">${S.show?'UNHIDE':'HIDE'}</button></div>${S.condition?`<div class="ai"><b>Condition</b><p>${esc(S.condition)}</p><button class="danger" onclick="S.condition='';render()">Remove Condition</button></div>`:''}<div class="row field"><button class="pill ${S.order==='random'?'on':''}" onclick="S.order='random';render()">Random</button><button class="pill ${S.order==='series'?'on':''}" onclick="S.order='series';render()">Series</button></div><div class="card"><div class="small">Question ${S.idx+1} of ${s.items.length}</div><h3>${esc(it.question)}</h3><label class="label">Your Answer</label><textarea id="qa" class="area"></textarea><button class="btn primary" style="width:100%" onclick="submit(it=${JSON.stringify(it).replace(/"/g,'&quot;')})">DONE — SUBMIT ANSWER</button>${S.show?`<div class="ai"><b>Correct Answer</b><p>${esc(it.answer)}</p></div>`:''}<div id="fb"></div></div><button class="outline" style="width:100%;margin-top:10px" onclick="nextQ()">NEXT QUESTION</button><div class="card field"><b>User: ${esc(u().username)}</b><div class="score">Score: ${u().score||0}</div><div class="small muted">+5 correct · -5 wrong</div></div></main></div>`}
function startQuiz(m){let s=u().sets.find(x=>x.id===S.recap);if(!s.items.length)return toast('This set has no questions.');S.recapMode=m;S.idx=0;render()}function condition(){modal(`<h3>Add Condition</h3><textarea id="cond" class="area" placeholder="Example: Ask only easy questions in Hinglish.">${esc(S.condition)}</textarea><button class="btn primary" style="width:100%;margin-top:9px" onclick="S.condition=$('cond').value.trim();close();render()">Apply Condition with AI</button>`)}
function submit(it){let a=$('qa').value.trim();if(!a)return toast('Write your answer first.');let ok=a.toLowerCase().replace(/\W/g,' ')===it.answer.toLowerCase().replace(/\W/g,' ');u().score=(u().score||0)+(ok?5:-5);if(!ok)(u().wrong||=[]).unshift({set:u().sets.find(s=>s.id===S.recap).name,question:it.question,your:a,correct:it.answer});save();$('fb').innerHTML=ok?'<div class="correct"><b>Correct ✓</b><br>+5</div>':`<div class="wrong"><b>Wrong ✕</b><br>-5<br>Correct: ${esc(it.answer)}</div>`}function nextQ(){let s=u().sets.find(x=>x.id===S.recap);S.idx=(S.idx+1)%s.items.length;render()}
function improve(){let x=u();return `<div class="app">${top()}<main class="page">${back()}<h2 class="title">Improve</h2><div class="ai"><b>Improve your mistakes</b><p class="muted">Wrong answers from Recap are saved only in this signed-in account.</p></div><div class="field"><b>Saved Sets</b>${x.sets.map(s=>`<button class="set" onclick="improveSet('${s.id}')">${esc(s.name)} →</button>`).join('')||'<div class="empty">No saved sets.</div>'}</div><div class="field"><b>Wrong Answers</b>${x.wrong?.length?x.wrong.map(w=>`<div class="wrong"><b>${esc(w.set)}</b><div>Q: ${esc(w.question)}</div><div>Your: ${esc(w.your)}</div><div>Correct: ${esc(w.correct)}</div><button class="outline" onclick="mistakeAI('${encodeURIComponent(JSON.stringify(w))}')">AI Explain</button></div>`).join(''):'<div class="empty">No wrong answers yet.</div>'}</div><div id="ia"></div></main>${bottom('improve')}</div>`}
async function improveSet(id){let s=u().sets.find(x=>x.id===id),w=(u().wrong||[]).filter(x=>x.set===s.name);if(!w.length)return toast('No mistakes for this set yet.');await ai('ia',`Create an improvement lesson for ${s.name}. Explain the mistakes and give 3 new practice questions.\n${w.map(x=>`Q:${x.question}\nUser:${x.your}\nCorrect:${x.correct}`).join('\n')}`)}async function mistakeAI(w){let x=JSON.parse(decodeURIComponent(w));await ai('ia',`Explain this mistake simply and give one similar practice question. Q:${x.question}\nUser:${x.your}\nCorrect:${x.correct}`)}
function modal(h){$('sheet').innerHTML=h;$('modal').classList.add('on')}function close(){$('modal').classList.remove('on')}$('modal').onclick=e=>{if(e.target.id==='modal')close()}
async function ai(id,prompt){let el=$(id);if(!el)return;el.innerHTML='<div class="loading">AI is thinking…</div>';try{let r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,userId:u()?.id})});if(!r.ok)throw 0;let d=await r.json(),text=d.output_text||d.text||d.answer||d.result;if(!text)throw 0;el.innerHTML='<b>AI</b><div class="result">'+esc(text)+'</div>'}catch(e){el.innerHTML='<b>AI endpoint not connected</b><div class="result">This UI is wired to <code>/api/ai</code>. Connect that secure backend endpoint to your AI provider. Do not put a secret API key in this HTML.</div>'}}
render();
</script></body></html>
