<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourSelf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- PAGE 1: Landing & Auth Page -->
    <div id="page-landing" class="page active">
        <div class="landing-container">
            <h1 class="app-title">YourSelf</h1>
            <p class="tagline">Test yourself without needing anyone to ask you question.</p>
            
            <div class="auth-box">
                <button id="show-signup-btn" class="btn-primary">Sign Up</button>
                <button id="show-signin-btn" class="btn-secondary">Sign In</button>
            </div>
        </div>

        <!-- Signup Modal/Form -->
        <div id="signup-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Create Account</h2>
                <form id="signup-form">
                    <input type="text" id="su-username" placeholder="Username" required>
                    <input type="email" id="su-email" placeholder="Email (must include .com)" required>
                    <input type="password" id="su-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Register</button>
                    <button type="button" class="close-modal">Cancel</button>
                </form>
            </div>
        </div>

        <!-- Signin Modal/Form -->
        <div id="signin-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Welcome Back</h2>
                <form id="signin-form">
                    <input type="text" id="si-identifier" placeholder="Username or Email" required>
                    <input type="password" id="si-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Log In</button>
                    <button type="button" class="close-modal">Cancel</button>
                </form>
            </div>
        </div>
    </div>

    <!-- PAGE 2: Dashboard Page -->
    <div id="page-dashboard" class="page">
        <header class="top-bar">
            <div class="logo-area">
                <span class="logo-text">YourSelf</span>
            </div>
            <div class="user-controls">
                <span class="account-icon">👤</span>
                <div class="hamburger-menu">
                    <div class="lines" id="hamburger-toggle">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div id="dropdown-menu" class="dropdown hidden">
                        <a href="#" id="menu-settings">Settings</a>
                        <a href="#" id="menu-help">Help</a>
                        <a href="#" id="menu-logout">Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <div class="dash-card" data-target="topic">Topic</div>
            <div class="dash-card" data-target="revision">Revision</div>
            <div class="dash-card" data-target="group">Group</div>
            <div class="dash-card" data-target="mistake">Mistake</div>
        </main>
    </div>

    <!-- PAGE 3: Topic Page -->
    <div id="page-topic" class="page">
        <button class="back-btn" data-back="dashboard">← Back</button>
        <div class="topic-wrapper">
            <div class="topic-input-box">
                <input type="text" id="topic-input" placeholder="Add the Topic">
            </div>
            <div id="topics-container" class="topics-grid"></div>
        </div>
    </div>

    <!-- PAGE 4: Add Questions Page -->
    <div id="page-questions" class="page">
        <button class="back-btn" data-back="topic">← Back to Topics</button>
        <header class="question-header">
            <h2 id="current-topic-title">Topic Name</h2>
        </header>
        <div class="center-content">
            <div class="add-q-box" id="open-q-modal">Add Questions</div>
        </div>

        <!-- Question Type Selection Modal -->
        <div id="q-type-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Select Question Type</h3>
                <button class="q-type-opt" data-type="mcq">MCQs</button>
                <button class="q-type-opt" data-type="qa">Question & Answer / One Word</button>
                <button class="q-type-opt" data-type="vocab">English Meaning / Hindi Meaning</button>
                <button type="button" class="close-modal">Cancel</button>
            </div>
        </div>

        <!-- Input Method Modal -->
        <div id="q-input-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="selected-type-title">Add Content</h3>
                <div class="input-method-tabs">
                    <button class="tab-btn active" data-method="manual">Text Input</button>
                    <button class="tab-btn" data-method="pdf">PDF Upload</button>
                    <button class="tab-btn" data-method="image">Image Capture/Upload</button>
                </div>
                
                <div id="method-manual" class="method-panel active">
                    <input type="text" id="q-text" placeholder="Enter Question">
                    <input type="text" id="a-text" placeholder="Enter Answer">
                    <input type="text" id="opt-text" placeholder="Options (comma separated, for MCQs)">
                    <button id="save-question-btn" class="btn-primary">Save Question</button>
                </div>
                <div id="method-pdf" class="method-panel hidden">
                    <input type="file" id="pdf-file" accept=".pdf">
                    <button class="btn-primary">Upload PDF</button>
                </div>
                <div id="method-image" class="method-panel hidden">
                    <input type="file" id="img-file" accept="image/*" capture="environment">
                    <button class="btn-primary">Upload/Capture Image</button>
                </div>
                <button type="button" class="close-modal">Cancel</button>
            </div>
        </div>
    </div>

    <!-- PAGE 5: Revision System Page -->
    <div id="page-revision" class="page">
        <button class="back-btn" data-back="dashboard">← Back to Dashboard</button>
        <div class="revision-wrapper">
            <h2>Select Topic to Revise</h2>
            <div id="revision-topics-list" class="topics-grid"></div>
        </div>

        <!-- Active Revision Session View -->
        <div id="revision-session" class="modal hidden" style="background:#000; position:fixed; top:0; left:0; width:100%; height:100%; z-index:2000; padding:20px; overflow-y:auto;">
            <button class="back-btn" id="quit-revision">✕ Quit Revision</button>
            <div class="revision-control-panel">
                <div class="score-box">Score: <span id="live-score">0</span></div>
                <div class="settings-toggle">
                    <label>Mode:</label>
                    <select id="rev-mode-type">
                        <option value="single">Single</option>
                        <option value="group">Group</option>
                    </select>
                    <select id="rev-flow-type">
                        <option value="random">Random Mode</option>
                        <option value="series">Series Mode</option>
                    </select>
                    <label>Mistake Mode:</label>
                    <input type="checkbox" id="mistake-mode-toggle" checked>
                </div>
            </div>
            
            <div class="quiz-card-container">
                <h3 id="quiz-q-text">Question goes here</h3>
                <div id="quiz-options-container"></div>
                <input type="text" id="quiz-answer-input" placeholder="Type your answer">
                <button id="submit-answer-btn" class="btn-primary">Submit Answer</button>
                <p id="quiz-feedback"></p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
